name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --set-exit-if-changed .
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Diagnostic facts for build failures: the runner's Xcode differs from
      # the local toolchain and the flutter tool only surfaces the xcresult
      # issue summary, never the raw xcodebuild error.
      - run: xcodebuild -version
      # Flutter <3.48 SPM rsync copies the package root (including example/build)
      # into itself recursively; the symlink breaks the loop (flutter#188647).
      - run: tool/link_example_build.sh
      - run: flutter pub get
        working-directory: example
      - run: flutter build ios --debug --no-codesign --verbose
        working-directory: example
