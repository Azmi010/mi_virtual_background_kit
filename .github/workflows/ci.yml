name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: dart format --set-exit-if-changed .
      - run: flutter test
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
        working-directory: example

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - run: flutter build apk --debug
        working-directory: example

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Flutter <3.48 SPM rsync copies the package root (including example/build)
      # into itself recursively; the symlink breaks the loop (flutter#188647).
      - run: tool/link_example_build.sh
      - run: flutter pub get
        working-directory: example
      # Package.swift path-deps need ios/flutter_webrtc-<ver> and ios/FlutterFramework
      # (gitignored local symlinks); recreate them from ephemeral .packages.
      - run: tool/link_spm_siblings.sh
      - run: flutter build ios --debug --no-codesign
        working-directory: example
