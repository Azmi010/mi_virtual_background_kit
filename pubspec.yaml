name: mi_virtual_background_kit
description: >-
  Real-time virtual background (blur, image, solid color) for flutter_webrtc
  camera tracks. Fully on-device, no network, no telemetry.
version: 0.1.0
repository: https://github.com/Azmi010/mi_virtual_background_kit
issue_tracker: https://github.com/Azmi010/mi_virtual_background_kit/issues
topics:
  - webrtc
  - video-call
  - virtual-background
  - blur
  - camera

screenshots:
  - description: Demo switching effects (none, blur, image, gradient)
    path: screenshots/demo.gif
  - description: Blur effect on a camera preview
    path: screenshots/blur.png
  - description: Image background (asset) with fit cover
    path: screenshots/image-office.png
  - description: Image background from a gradient asset
    path: screenshots/image-gradient.png

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_webrtc: ^1.6.2
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.azmi010.mi_virtual_background_kit
        pluginClass: MiVirtualBackgroundKitPlugin
      ios:
        pluginClass: MiVirtualBackgroundKitPlugin
